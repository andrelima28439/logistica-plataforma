name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build solution
        run: dotnet build src/LogisticaPlataforma.sln --nologo

      - name: Verify formatting (dotnet format)
        run: dotnet format src/LogisticaPlataforma.sln whitespace --verify-no-changes

      - name: Test + cobertura (Coverlet)
        run: >
          dotnet test src/LogisticaPlataforma.sln --nologo --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: coverage/**/coverage.cobertura.xml

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npx ng lint

      - name: Build production
        run: npx ng build --configuration production

  docker:
    name: Docker images (bonus, sem push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagens das APIs + frontend
        run: |
          docker build -t logistica/entrega-api:ci -f src/Entrega.Api/Dockerfile .
          docker build -t logistica/rastreamento-api:ci -f src/Rastreamento.Api/Dockerfile .
          docker build -t logistica/roteamento-api:ci -f src/Roteamento.Api/Dockerfile .
          docker build -t logistica/alerta-api:ci -f src/Alerta.Api/Dockerfile .
          docker build -t logistica/frontend:ci -f frontend/Dockerfile .
